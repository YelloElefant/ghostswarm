services:
  bot:
    build: .
    container_name: ghostswarm-bot1
    environment:
      - BOT_ID=bigppserver2
      - MQTT_BROKER_URL=mqtt://100.76.233.82:1883
      - SEED_PORT=5000
    volumes:
      - /etc/hostname:/host_hostname:ro
      - ./data:/data
    ports:
      - "5002:5000" # Port for the seeder service
    restart: unless-stopped
