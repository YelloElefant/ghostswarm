services:
  bot:
    build: .
    container_name: ghostswarm-bot1
    network_mode: "host" # Use host networking
    environment:
      - BOT_ID=bigppserver2
      - MQTT_BROKER_URL=mqtt://100.76.233.82:1883
      - SEED_PORT=5000
    volumes:
      - /etc/hostname:/host_hostname:ro
      - ./data:/data
    restart: unless-stopped
    # No port mapping needed with host mode
