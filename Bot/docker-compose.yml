services:
  bot:
    build: .
    container_name: ghostswarm-bot1
    environment:
      - BOT_ID=bigppserver2
      - MQTT_BROKER_URL=mqtt://100.76.233.82:1883
      - SEED_PORT=5000
    volumes:
      - /etc/hostname:/host_hostname:ro
      - ./data:/data
      # Mount Tailscale (same as controller)
      - /home/yelloelefant/tailscale/data:/var/lib/tailscale
      - /var/run/tailscale:/var/run/tailscale
    ports:
      - "5000:5000"
    restart: unless-stopped
    # Add network capabilities for Tailscale
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
