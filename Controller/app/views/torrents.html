<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostSwarm Torrent Manager</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/torrents.css" />
  </head>
  <body>
    <h1>🧠 GhostSwarm Torrents</h1>
    <table id="torrentTable">
      <thead>
        <tr>
          <th>Filename</th>
          <th>Size</th>
          <th>Pieces</th>
          <th>Hash</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      async function fetchTorrents() {
        const res = await fetch("/api/torrents/");
        const torrents = await res.json();
        const table = document.querySelector("#torrentTable tbody");
        table.innerHTML = "";

        torrents.forEach((t) => {
          const row = document.createElement("tr");

          row.innerHTML = `
          <td>${t.name}</td>
          <td>${(t.size / 1024).toFixed(1)} KB</td>
          <td>${t.pieces}</td>
          <td style="font-size: 0.8rem">${t.hash}</td>
          <td><button onclick="deleteTorrent('${t.hash}')">Delete</button></td>
        `;

          table.appendChild(row);
        });
      }

      async function deleteTorrent(hash) {
        if (!confirm(`Are you sure you want to delete torrent ${hash}?`))
          return;
        const res = await fetch(`api/torrents/${hash}`, { method: "DELETE" });

        if (res.ok) {
          alert("Torrent deleted successfully");
          fetchTorrents();
        } else {
          console.log("Failed to delete torrent:", await res.text());

          alert("Failed to delete torrent");
        }
      }

      fetchTorrents();
    </script>
  </body>
</html>
