<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostSwarm – Upload Torrent</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/upload.css" />
  </head>
  <body>
    <div class="upload-container">
      <h1>Register Torrent</h1>
      <form id="uploadForm" class="dropzone">
        <input type="file" name="torrentFile" id="torrentFile" />
        <button type="submit">Upload</button>
      </form>
      <div id="uploadStatus">Drag and drop a file or use the button above.</div>
    </div>

    <div id="settingsModal" class="modal">
      <div class="modal-content">
        <h2>Configure Torrent</h2>
        <form id="settingsForm">
          <label for="torrentName">Torrent Name</label>
          <input type="text" id="torrentName" name="name" required />

          <label>Tags</label>
          <div id="tagInputWrapper">
            <div id="tagList"></div>
            <input
              type="text"
              id="tagInput"
              placeholder="Type tag and press Enter"
            />
          </div>

          <label>
            <input type="checkbox" id="enableSeeding" name="seeding" />
            Enable Seeding
          </label>

          <div class="button-row">
            <button type="button" id="cancelSettings">Cancel</button>
            <button type="button" id="previewSettings">Next</button>
          </div>
        </form>
      </div>
    </div>

    <div id="previewModal" class="modal">
      <div class="modal-content">
        <h2>Preview Torrent</h2>
        <ul id="previewList"></ul>
        <div class="button-row">
          <button type="button" id="backToSettings">Back</button>
          <button type="button" id="confirmUpload">Upload</button>
        </div>
      </div>
    </div>

    <script src="/upload.js"></script>
  </body>
</html>
