<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostSwarm – Upload Torrent</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/upload.css" />
  </head>
  <body>
    <div class="upload-container">
      <h1>Register Torrent</h1>
      <form id="uploadForm" class="dropzone">
        <input type="file" name="torrentFile" id="torrentFile" />
        <button type="submit">Upload</button>
      </form>
      <div id="uploadStatus">Drag and drop a file or use the button above.</div>
    </div>

    <script src="/upload.js"></script>
  </body>
</html>
