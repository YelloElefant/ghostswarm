<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>GhostSwarm Bot • Dashboard</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://unpkg.com/d3@7"></script>
</head>
<!-- 🐘 -->

<body class="matrix-bg">
    <header>
        <div id="title">
            <div id="icon">
                <i class="material-icons" id="network-icon">hub</i>
            </div>
            <span id="ghostswarm">GhostSwarm</span>
        </div>
        <div id="botBadge" class="online">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="botStatus">Connecting</span>
            <span id="botId"></span>
        </div>
    </header>
    <main class="dashboard">
        <aside id="sidebar" aria-label="Swarm controls">
            <section class="sidebar-section">
                <div class="section-heading">
                    <h2>Peers</h2>
                    <span id="peerCount" class="count-badge">0</span>
                </div>
                <div id="peerList" class="peer-list" aria-live="polite"></div>
                <div id="peerDetails" class="peer-details" hidden>
                    <div class="section-heading">
                        <h3>Peer Details</h3>
                        <button id="closePeerDetails" class="icon-button" aria-label="Close peer details">×</button>
                    </div>
                    <dl>
                        <dt>Peer ID</dt>
                        <dd id="detailId"></dd>
                        <dt>Last seen</dt>
                        <dd id="detailLastSeen"></dd>
                    </dl>
                    <button id="messagePeerBtn" class="secondary full-width">Message this peer</button>
                </div>
            </section>

            <section class="sidebar-section">
                <h2>Bot Status</h2>
                <label for="statusTarget">Bot</label>
                <select id="statusTarget" aria-label="Bot to check"></select>
                <button id="getStatusBtn" class="full-width">Get Status</button>
                <div id="statusResult" class="status-result" aria-live="polite"></div>
            </section>

            <section class="sidebar-section">
                <h2>Send Broadcast</h2>
                <label for="topic">Topic</label>
                <input id="topic" placeholder="Topic" value="chat" list="topicOptions">
                <datalist id="topicOptions">
                    <option value="chat"></option>
                </datalist>
                <label for="data">Message</label>
                <input id="data" placeholder="Message">
                <button id="sendBlastBtn" class="full-width">Send Broadcast</button>
            </section>

            <section class="sidebar-section">
                <h2>Send Direct Message</h2>
                <label for="to">Recipient</label>
                <select id="to" aria-label="Recipient bot">
                    <option value="">Select a peer</option>
                </select>
                <label for="op">Message type</label>
                <select id="op" aria-label="Message type">
                    <option value="message">Message</option>
                </select>
                <label for="json">Message</label>
                <textarea id="json" rows="4" placeholder="Type a message"></textarea>
                <button id="sendDmBtn" class="full-width">Send Message</button>
                <pre id="dmResult" class="muted" aria-live="polite"></pre>
            </section>
        </aside>

        <section class="graph-stage" aria-label="Swarm graph">
            <div class="graph-toolbar">
                <button id="sidebarToggle" class="icon-button" aria-label="Hide sidebar" aria-expanded="true">
                    <i class="material-icons" aria-hidden="true">menu</i>
                </button>
                <div>
                    <h1>Swarm Graph</h1>
                    <p id="graphSummary" class="muted">Connecting to swarm…</p>
                </div>
            </div>
            <div id="graphWrapper">
                <svg id="swarmGraph" role="img" aria-label="Interactive graph of this bot and connected peers"></svg>
            </div>
        </section>
    </main>

    <script src="lib.js"></script>
    <script src="script.js"></script>
</body>

</html>
