<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>GhostSwarm Bot • Dashboard</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://unpkg.com/d3@7"></script>
</head>
<!-- 🐘 -->

<body class="matrix-bg">
    <header>
        <div id="title">
            <div id="icon">
                <i class="material-icons" id="network-icon">hub</i>
            </div>
            <span id="ghostswarm">GhostSwarm</span>
        </div>
        <div id="botBadge">
            <div>
                <svg width="12" height="12">
                    <circle cx="6" cy="6" r="5" fill="#4caf50" />
                </svg>
            </div>
            <div id="botStatus">
                Connected
            </div>
            <div id="botId"></div>
        </div>
    </header>
    <p class="muted" id="subtitle"></p>

    <div class="grid">
        <details class="card" open>
            <summary><h3>Peers</h3></summary>
            <div class="card-content">
                <table id="peers">
                    <thead>
                        <tr>
                            <th>Peer</th>
                            <th>Last seen</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </details>

        <details class="card" open>
            <summary><h3>Send Broadcast</h3></summary>
            <div class="card-content">
                <div class="row">
                    <input id="topic" aria-label="Broadcast topic" placeholder="Topic" value="chat" list="topicOptions">
                    <datalist id="topicOptions">
                        <option value="chat"></option>
                    </datalist>
                    <input id="data" aria-label="Broadcast message" placeholder="Message">
                    <button id="sendBlastBtn">Send</button>
                </div>
            </div>
        </details>

        <details class="card" open>
            <summary><h3>Send Direct Message</h3></summary>
            <div class="card-content">
                <div class="row">
                    <select id="to" aria-label="Recipient bot">
                        <option value="">Select a peer</option>
                    </select>
                    <select id="op" aria-label="Message type">
                        <option value="message">Message</option>
                    </select>
                </div>
                <div class="row" style="margin-top:8px;">
                    <textarea id="json" aria-label="Message data in JSON format" rows="4" placeholder='{"foo":1}'></textarea>
                </div>
                <div class="row" style="margin-top:8px;">
                    <button id="sendDmBtn">Send</button>
                </div>
                <pre id="dmResult" class="muted"></pre>
            </div>
        </details>

        <details class="card" open>
            <summary><h3>Swarm Graph</h3></summary>
            <div class="card-content">
                <div id="graphWrapper">
                    <svg id="swarmGraph"></svg>
                </div>
            </div>
        </details>
    </div>

    <script src="lib.js"></script>
    <script src="script.js"></script>
</body>

</html>
