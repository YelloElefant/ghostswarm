<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>GhostSwarm Bot • Dashboard</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://unpkg.com/d3@7"></script>
</head>
<!-- 🐘 -->

<body>
    <header>
        <div id="title">
            <div id="icon">
                <i class="material-icons" id="network-icon">hub</i>
            </div>
            <span id="ghostswarm">GhostSwarm</span>
        </div>
        <div id="botBadge" class="online">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="botStatus">Connecting</span>
            <span id="botId"></span>
        </div>
    </header>

    <main class="stage">
        <svg id="swarmGraph" role="img" aria-label="Interactive graph of this bot and connected peers"></svg>
        <p id="graphSummary" class="graph-summary muted">Connecting to swarm…</p>

        <details id="filesCard" class="float-card left" open>
            <summary>
                <i class="material-icons" aria-hidden="true">folder_open</i>
                <span>Files</span>
                <span id="filesCount" class="count-badge">0</span>
            </summary>
            <div class="card-body">
                <label class="toggle">
                    <input id="autoDownload" type="checkbox">
                    Tell All Bots To Download Uploads
                </label>
                <label id="dropZone" class="drop-zone" for="fileInput">
                    <i class="material-icons" aria-hidden="true">cloud_upload</i>
                    <strong>Drop Files Anywhere</strong>
                    <span class="muted">Or click to browse</span>
                    <input id="fileInput" type="file" multiple hidden>
                </label>
                <ul id="uploadList" class="upload-list" aria-live="polite"></ul>
                <ul id="fileList" class="file-list"></ul>
                <p id="filesEmpty" class="muted">No files yet.</p>
            </div>
        </details>

        <details id="messageCard" class="float-card right">
            <summary>
                <i class="material-icons" aria-hidden="true">chat</i>
                <span>Send Message</span>
            </summary>
            <div class="card-body">
                <label for="to">Recipient</label>
                <select id="to" aria-label="Recipient"></select>
                <label for="text">Message</label>
                <textarea id="text" rows="3" placeholder="Type a message"></textarea>
                <button id="sendBtn" class="full-width">Send</button>
            </div>
        </details>

        <div id="toasts" aria-live="polite"></div>
    </main>

    <div id="dropOverlay" hidden>
        <div>
            <i class="material-icons" aria-hidden="true">cloud_upload</i>
            <strong>Drop To Upload</strong>
            <span id="dropMode"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
